<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일기장</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .write-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input[type="date"],
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save {
            background: #667eea;
            color: white;
        }

        .btn-save:hover {
            background: #5568d3;
        }

        .btn-clear {
            background: #ddd;
            color: #333;
        }

        .btn-clear:hover {
            background: #ccc;
        }

        .diary-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .diary-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .diary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .diary-date {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .diary-title {
            color: #333;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .diary-content {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
            max-height: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
        }

        .diary-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .diary-delete:hover {
            background: #ff5252;
        }

        .empty-message {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 40px;
        }

        .no-diary {
            grid-column: 1 / -1;
            text-align: center;
            color: #999;
            padding: 40px;
            background: white;
            border-radius: 15px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 32px;
            }

            .button-group {
                flex-direction: column;
            }

            .diary-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📔 나의 일기장</h1>
        </div>

        <div class="write-section">
            <h2 style="margin-bottom: 20px; color: #333;">오늘의 일기</h2>
            <form id="diaryForm">
                <div class="form-group">
                    <label for="diaryDate">날짜</label>
                    <input type="date" id="diaryDate" required>
                </div>

                <div class="form-group">
                    <label for="diaryTitle">제목</label>
                    <input type="text" id="diaryTitle" placeholder="오늘의 제목을 입력하세요..." required>
                </div>

                <div class="form-group">
                    <label for="diaryContent">내용</label>
                    <textarea id="diaryContent" placeholder="오늘 있었던 일들을 자유롭게 적어보세요..." required></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-save">저장</button>
                    <button type="reset" class="btn btn-clear">초기화</button>
                </div>
            </form>
        </div>

        <h2 style="color: white; margin-bottom: 20px;">작성한 일기</h2>
        <div class="diary-list" id="diaryList"></div>
    </div>

    <script>
        const diaryForm = document.getElementById('diaryForm');
        const diaryDate = document.getElementById('diaryDate');
        const diaryList = document.getElementById('diaryList');
        let diaries = JSON.parse(localStorage.getItem('diaries')) || [];

        // 오늘 날짜 자동 설정
        const today = new Date().toISOString().split('T')[0];
        diaryDate.value = today;

        function saveDiaries() {
            localStorage.setItem('diaries', JSON.stringify(diaries));
        }

        function renderDiaries() {
            diaryList.innerHTML = '';

            if (diaries.length === 0) {
                diaryList.innerHTML = '<div class="no-diary">작성한 일기가 없습니다. 첫 일기를 작성해보세요!</div>';
                return;
            }

            // 최신순으로 정렬
            const sortedDiaries = [...diaries].reverse();

            sortedDiaries.forEach((diary, index) => {
                const card = document.createElement('div');
                card.className = 'diary-card';
                card.innerHTML = `
                    <div class="diary-date">${diary.date}</div>
                    <div class="diary-title">${diary.title}</div>
                    <div class="diary-content">${diary.content}</div>
                    <button class="diary-delete" onclick="deleteDiary(${diaries.length - 1 - index})">삭제</button>
                `;
                diaryList.appendChild(card);
            });
        }

        diaryForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const date = diaryDate.value;
            const title = document.getElementById('diaryTitle').value.trim();
            const content = document.getElementById('diaryContent').value.trim();

            if (!date || !title || !content) {
                alert('모든 항목을 입력해주세요!');
                return;
            }

            diaries.push({
                date: new Date(date).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }),
                title,
                content
            });

            saveDiaries();
            renderDiaries();

            // 폼 초기화 및 오늘 날짜 설정
            diaryForm.reset();
            diaryDate.value = today;
            document.getElementById('diaryTitle').focus();
        });

        function deleteDiary(index) {
            if (confirm('정말 삭제하시겠습니까?')) {
                diaries.splice(index, 1);
                saveDiaries();
                renderDiaries();
            }
        }

        renderDiaries();
    </script>
</body>
</html>
